server {
    listen 80;
    server_name kingvcam.com www.kingvcam.com api.kingvcam.com admin.kingvcam.com gdnew.kingvcam.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kingvcam.com www.kingvcam.com;
    ssl_certificate /etc/letsencrypt/live/kingvcam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kingvcam.com/privkey.pem;
    location / {
        proxy_pass http://kingvcam-api-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.kingvcam.com;
    ssl_certificate /etc/letsencrypt/live/kingvcam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kingvcam.com/privkey.pem;
    location /api/ {
        proxy_pass http://kingvcam-api-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.kingvcam.com;
    ssl_certificate /etc/letsencrypt/live/kingvcam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kingvcam.com/privkey.pem;
    location = / { return 302 /admin; }
    location /admin {
        proxy_pass http://kingvcam-api-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://kingvcam-api-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}
