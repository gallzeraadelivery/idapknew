name: gdnew

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdnew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gdnew
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdnew"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: gdnew-api
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./debug-logs:/app/debug-logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - gdnew_web

volumes:
  pgdata:
    name: gdnew_postgres_data

networks:
  gdnew_web:
    name: gdnew_web
