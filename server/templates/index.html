<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDnew</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><div class="brand">GDnew</div><nav class="site-nav"><a href="/account/login">Entrar</a><a class="nav-primary" href="/account/register">Criar conta</a></nav></header>
<main><div class="hero"><img class="logo" src="/static/logo.png" alt="GDnew" width="128" height="128"><p class="eyebrow">Conta e créditos GDnew</p></div>
<section class="plans">{% for package in packages %}<article class="card{% if package.popular %} popular{% endif %}">{% if package.popular %}<span class="badge">POPULAR</span>{% endif %}<h2>{{ package.label }}</h2><p class="price">$ {{ '%.2f'|format(package.price_usd) }}</p><a class="nav-primary" href="/account/register">Criar conta</a></article>{% endfor %}</section>
<p class="note">Entre ou crie sua conta para comprar créditos e acompanhar seu saldo no GDnew.</p></main>
</body></html>
